<svg xmlns="http://www.w3.org/2000/svg" width="760" height="443" viewBox="0 0 760 443" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" role="img" aria-labelledby="t d">
<title id="t">GitHub Copilotの月額と毎月含まれるAIクレジット</title>
<desc id="d">GitHub Copilotの月額と含まれるクレジット。Proは月10ドルで15ドル分、Pro+は39ドルで70ドル分、Maxは100ドルで200ドル分、Businessは1席19ドルで19ドル分。</desc>
