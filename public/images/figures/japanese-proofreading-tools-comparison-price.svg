<svg xmlns="http://www.w3.org/2000/svg" width="760" height="617" viewBox="0 0 760 617" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" role="img" aria-labelledby="t d">
<title id="t">日本語の校正ツールの月額</title>
<desc id="d">日本語の校正ツールの月額。文賢パーソナルは月1,980円(1年更新は月あたり1,650円)、Shodoはベーシック0円・プレミアム1,000円・マックス5,000円、Microsoft 365 Personalは月2,130円。</desc>
<rect x="0" y="0" width="760" height="617" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="759" height="616" fill="none" stroke="#e5e7eb" rx="6"/>
<text x="24.0" y="38.0" font-size="19" fill="#111827" font-weight="bold">日本語の校正ツールの月額</text>
<text x="24.0" y="59.0" font-size="13" fill="#4b5563">単位: 円/月(税込)。文賢は1年更新の月あたりの額も並べる</text>
<rect x="24" y="68" width="14" height="14" rx="2" fill="#1d4ed8"/>
<text x="44.0" y="80.0" font-size="13" fill="#111827">月額</text>
<rect x="92.0" y="68" width="14" height="14" rx="2" fill="#93c5fd"/>
<text x="112.0" y="80.0" font-size="13" fill="#111827">1年更新(月あたり)</text>
<text x="24.0" y="140.0" font-size="14" fill="#111827" font-weight="bold">文賢 パーソナル</text>
<rect x="266.2" y="117.0" width="163.8" height="16" rx="2" fill="#1d4ed8"/>
<text x="436.1" y="129.5" font-size="12.5" fill="#111827">1,980円</text>
<rect x="266.2" y="137.0" width="136.5" height="16" rx="2" fill="#93c5fd"/>
<text x="408.8" y="149.5" font-size="12.5" fill="#111827">1,650円</text>
<line x1="24" y1="161.0" x2="736" y2="161.0" stroke="#e5e7eb"/>
<text x="24.0" y="184.0" font-size="14" fill="#111827" font-weight="bold">文賢 ビジネスチーム</text>
<text x="24.0" y="201.0" font-size="12" fill="#6b7280">1ユーザーあたり</text>
<rect x="266.2" y="169.0" width="273.1" height="16" rx="2" fill="#1d4ed8"/>
<text x="545.3" y="181.5" font-size="12.5" fill="#111827">3,300円</text>
<rect x="266.2" y="189.0" width="227.6" height="16" rx="2" fill="#93c5fd"/>
<text x="499.8" y="201.5" font-size="12.5" fill="#111827">2,750円</text>
<line x1="24" y1="213.0" x2="736" y2="213.0" stroke="#e5e7eb"/>
<text x="24.0" y="244.0" font-size="14" fill="#111827" font-weight="bold">Shodo ベーシック</text>
<text x="272.2" y="233.5" font-size="12.5" fill="#111827">0円</text>
<line x1="24" y1="265.0" x2="736" y2="265.0" stroke="#e5e7eb"/>
<text x="24.0" y="296.0" font-size="14" fill="#111827" font-weight="bold">Shodo プレミアム</text>
<rect x="266.2" y="273.0" width="82.8" height="16" rx="2" fill="#1d4ed8"/>
<text x="355.0" y="285.5" font-size="12.5" fill="#111827">1,000円</text>
<line x1="24" y1="317.0" x2="736" y2="317.0" stroke="#e5e7eb"/>
<text x="24.0" y="348.0" font-size="14" fill="#111827" font-weight="bold">Shodo マックス</text>
<rect x="266.2" y="325.0" width="413.8" height="16" rx="2" fill="#1d4ed8"/>
<text x="686.0" y="337.5" font-size="12.5" fill="#111827">5,000円</text>
<line x1="24" y1="369.0" x2="736" y2="369.0" stroke="#e5e7eb"/>
<text x="24.0" y="392.0" font-size="14" fill="#111827" font-weight="bold">Shodo ビジネス</text>
<text x="24.0" y="409.0" font-size="12" fill="#6b7280">1名あたり・3名から</text>
<rect x="266.2" y="377.0" width="165.5" height="16" rx="2" fill="#1d4ed8"/>
<text x="437.7" y="389.5" font-size="12.5" fill="#111827">2,000円</text>
<line x1="24" y1="421.0" x2="736" y2="421.0" stroke="#e5e7eb"/>
<text x="24.0" y="444.0" font-size="14" fill="#111827" font-weight="bold">Microsoft 365 Personal</text>
<text x="24.0" y="461.0" font-size="12" fill="#6b7280">Word の高度な提案(年21,300円の表示も)</text>
<rect x="266.2" y="429.0" width="176.3" height="16" rx="2" fill="#1d4ed8"/>
<text x="448.5" y="441.5" font-size="12.5" fill="#111827">2,130円</text>
<line x1="24" y1="473.0" x2="736" y2="473.0" stroke="#e5e7eb"/>
<text x="24.0" y="496.0" font-size="14" fill="#111827" font-weight="bold">Google ドキュメント</text>
<text x="24.0" y="513.0" font-size="12" fill="#6b7280">標準の訂正案は日本語が対象外</text>
<text x="272.2" y="493.5" font-size="12.5" fill="#111827">0円</text>
<line x1="266.2" y1="109.0" x2="266.2" y2="525.0" stroke="#9ca3af"/>
<line x1="24" y1="535" x2="736" y2="535" stroke="#e5e7eb"/>
<text x="24.0" y="559.0" font-size="12" fill="#4b5563">ChatGPT など生成AIは無料版あり。有料は Go・Plus・Pro・Business・Enterprise(図には含めない)</text>
<text x="24.0" y="577.0" font-size="12" fill="#4b5563">文賢は14日間、Shodo の有料プランは14日間(1回だけ)の無料トライアルあり</text>
<text x="24.0" y="597.0" font-size="12" fill="#6b7280">出所: 2026年11月 記事の表より作成</text>
</svg>
