<text x="659.0" y="262.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<text x="28.0" y="298.0" font-size="13.5" fill="#111827" font-weight="bold">録音通知バナーを非表示</text>
<rect x="277.0" y="278" width="148.0" height="30" rx="4" fill="#f3f4f6"/>
<text x="351.0" y="298.0" font-size="14" fill="#6b7280" font-weight="bold" text-anchor="middle">不可</text>
<rect x="431.0" y="278" width="148.0" height="30" rx="4" fill="#dcfce7"/>
<text x="505.0" y="298.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<rect x="585.0" y="278" width="148.0" height="30" rx="4" fill="#dcfce7"/>
<text x="659.0" y="298.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<text x="28.0" y="334.0" font-size="13.5" fill="#111827" font-weight="bold">自分が主催するZoom会議に自動追加</text>
<rect x="277.0" y="314" width="148.0" height="30" rx="4" fill="#f3f4f6"/>
<text x="351.0" y="334.0" font-size="14" fill="#6b7280" font-weight="bold" text-anchor="middle">不可</text>
<rect x="431.0" y="314" width="148.0" height="30" rx="4" fill="#dcfce7"/>
<text x="505.0" y="334.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<rect x="585.0" y="314" width="148.0" height="30" rx="4" fill="#dcfce7"/>
<text x="659.0" y="334.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<text x="28.0" y="370.0" font-size="13.5" fill="#111827" font-weight="bold">Web会議の録画(画面の記録)</text>
<rect x="277.0" y="350" width="148.0" height="30" rx="4" fill="#f3f4f6"/>
<text x="351.0" y="370.0" font-size="14" fill="#6b7280" font-weight="bold" text-anchor="middle">—</text>
<rect x="431.0" y="350" width="148.0" height="30" rx="4" fill="#f3f4f6"/>
<text x="505.0" y="370.0" font-size="14" fill="#6b7280" font-weight="bold" text-anchor="middle">—</text>
<rect x="585.0" y="350" width="148.0" height="30" rx="4" fill="#dcfce7"/>
<text x="659.0" y="370.0" font-size="14" fill="#14532d" font-weight="bold" text-anchor="middle">可</text>
<line x1="24" y1="393" x2="736" y2="393" stroke="#e5e7eb"/>
<text x="24.0" y="417.0" font-size="12" fill="#4b5563">同時に記録できる会議は、3プランとも契約アカウント数と同じ件数</text>
<text x="24.0" y="435.0" font-size="12" fill="#4b5563">Web会議の録画は、料金ページではビジネスからの機能</text>
<text x="24.0" y="455.0" font-size="12" fill="#6b7280">出所: 2026年11月 記事の表より作成</text>
</svg>
