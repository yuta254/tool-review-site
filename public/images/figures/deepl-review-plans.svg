<svg xmlns="http://www.w3.org/2000/svg" width="760" height="403" viewBox="0 0 760 403" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" role="img" aria-labelledby="t d">
<title id="t">DeepLのプラン別の料金と1か月の上限</title>
